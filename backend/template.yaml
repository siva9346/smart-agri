AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart Agri – Agri Management Backend (Python)

# ─── Global defaults applied to every Lambda ─────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]        # Graviton2 – 20% cheaper, faster cold starts
    Timeout: 29                   # Keep under API GW 30s timeout
    MemorySize: 512
    CodeUri: src/                 # Single code package shared across all functions
    Environment:
      Variables:
        JWT_SECRET: !Ref JwtSecret
        USERS_TABLE: !Ref UsersTable
        LANDS_TABLE: !Ref LandsTable
        CROP_CYCLES_TABLE: !Ref CropCyclesTable
        DAILY_RECORDS_TABLE: !Ref DailyRecordsTable
        PRODUCTS_TABLE: !Ref ProductsTable
        ORDERS_TABLE: !Ref OrdersTable
        ADVICE_TABLE: !Ref AdviceTable
        NOTIFICATIONS_TABLE: !Ref NotificationsTable
        ENQUIRIES_TABLE: !Ref EnquiriesTable
        SYMPTOMS_TABLE: !Ref SymptomsTable
        CONSULTATIONS_TABLE: !Ref ConsultationsTable
        LEADS_TABLE: !Ref LeadsTable
        LEAD_ACTIVITIES_TABLE: !Ref LeadActivitiesTable
        QUOTATIONS_TABLE: !Ref QuotationsTable
        TASKS_TABLE: !Ref TasksTable
        INBOX_TABLE: !Ref InboxTable
        SETTINGS_TABLE: !Ref SettingsTable
        AUDIT_TABLE: !Ref AuditTable
        AUTOMATION_RUNS_TABLE: !Ref AutomationRunsTable
        PHOTOS_BUCKET: !Ref RecordPhotosBucket
        AI_KEY_PARAM_PREFIX: /naveena/ai/
        SECRET_PARAM_PREFIX: /naveena/
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ['*']
      AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      AllowHeaders: [Content-Type, Authorization]
      MaxAge: 600

# ─── Parameters ──────────────────────────────────────────────────────────────
Parameters:
  JwtSecret:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /naveena/jwt-secret
    Description: JWT signing secret stored in SSM Parameter Store (must be type String — SecureString is not supported here, and ssm-secure dynamic references are not supported in Lambda env vars)
  GmailAddress:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /naveena/gmail-address
    Description: Gmail address EmailFunction sends OTP emails from (via smtplib, not SES)
  GmailAppPassword:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /naveena/gmail-app-password
    Description: 16-char Gmail App Password for GmailAddress (Google Account > Security > App Passwords). Same SSM String limitation as JwtSecret above.

Resources:

  # ── API Gateway ─────────────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Description: Smart Agri REST API

  # ─────────────────────────────────────────────────────────────────────────────
  # LAMBDA FUNCTIONS  (Python 3.12, arm64 Graviton2)
  # boto3 is available in the Lambda runtime — not included in requirements.txt.
  # SAM installs requirements.txt from src/ during sam build.
  # ─────────────────────────────────────────────────────────────────────────────

  # ── Auth ─────────────────────────────────────────────────────────────────────
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.auth.handler
      Description: Login and token verification
      Environment:
        Variables:
          EMAIL_FUNCTION_NAME: !Ref EmailFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SettingsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref EmailFunction
      Events:
        Root: { Type: HttpApi, Properties: { Path: "/auth/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Email (internal only — no API Gateway route) ─────────────────────────────
  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.email.handler
      Description: Sends transactional email via Gmail SMTP (smtplib) — invoked by other Lambdas only
      Timeout: 10
      Environment:
        Variables:
          GMAIL_ADDRESS: !Ref GmailAddress
          GMAIL_APP_PASSWORD: !Ref GmailAppPassword

  # ── Farmers ──────────────────────────────────────────────────────────────────
  FarmersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.farmers.handler
      Description: Farmer (customer) CRUD – admin only for list/create/delete
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref LandsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CropCyclesTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /farmers,         Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/farmers/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Lands ─────────────────────────────────────────────────────────────────────
  LandsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.lands.handler
      Description: Land parcel CRUD
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LandsTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /lands,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/lands/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Crop Cycles ───────────────────────────────────────────────────────────────
  CropCyclesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.crop_cycles.handler
      Description: Crop cultivation cycle management
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CropCyclesTable
        - DynamoDBReadPolicy:
            TableName: !Ref LandsTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /crop-cycles,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/crop-cycles/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Daily Records ─────────────────────────────────────────────────────────────
  RecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.records.handler
      Description: Daily farming activity records (expenses, harvests, symptoms)
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref RecordPhotosBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyRecordsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CropCyclesTable
        - S3WritePolicy:
            BucketName: !Ref RecordPhotosBucket
      Events:
        Root: { Type: HttpApi, Properties: { Path: /records,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/records/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Products ──────────────────────────────────────────────────────────────────
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.products.handler
      Description: Fertilizer/product catalogue (internal roles only)
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref RecordPhotosBucket
      Policies:
        - !Ref CoreDataPolicy   # users + settings: live account check and role permissions
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - S3WritePolicy:
            BucketName: !Ref RecordPhotosBucket
        # S3WritePolicy doesn't include DeleteObject — needed to clean up a
        # product's old photo when it's replaced or the product is deleted.
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub '${RecordPhotosBucket.Arn}/*'
      Events:
        Root: { Type: HttpApi, Properties: { Path: /products,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/products/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Orders ────────────────────────────────────────────────────────────────────
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.orders.handler
      Description: Farmer product orders
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable   # needed for stock decrement on order create
      Events:
        Root: { Type: HttpApi, Properties: { Path: /orders,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/orders/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Expert Advice ─────────────────────────────────────────────────────────────
  AdviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.advice.handler
      Description: Farmer–admin expert advice channel
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdviceTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /advice,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/advice/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Notifications ─────────────────────────────────────────────────────────────
  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.notifications.handler
      Description: Announcements + per-user notification inbox (read/dismiss state); fans out asynchronously
      Timeout: 120      # async fan-out runs can take longer; API calls are still capped by API Gateway's 30s
      Policies:
        - !Ref CoreDataPolicy
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction   # async self-invocation for audience fan-out
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-NotificationsFunction-*'
      Events:
        Root: { Type: HttpApi, Properties: { Path: /notifications,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/notifications/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Enquiries ─────────────────────────────────────────────────────────────────
  EnquiriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.enquiries.handler
      Description: Farmer support enquiries
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EnquiriesTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /enquiries,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/enquiries/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Symptoms ──────────────────────────────────────────────────────────────────
  SymptomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.symptoms.handler
      Description: Crop disease / symptom reference database
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SymptomsTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /symptoms,          Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/symptoms/{proxy+}",  Method: ANY, ApiId: !Ref Api } }

  # ── Shared data-access policy for the CRM / consultation / AI functions ──────
  CoreDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read/write on the CRM, consultation, notification and settings tables; read-only on catalogue and farm data
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchWriteItem
              - dynamodb:BatchGetItem
              - dynamodb:ConditionCheckItem
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt UsersTable.Arn
              - !Sub '${UsersTable.Arn}/index/*'
              - !GetAtt ConsultationsTable.Arn
              - !Sub '${ConsultationsTable.Arn}/index/*'
              - !GetAtt LeadsTable.Arn
              - !Sub '${LeadsTable.Arn}/index/*'
              - !GetAtt LeadActivitiesTable.Arn
              - !Sub '${LeadActivitiesTable.Arn}/index/*'
              - !GetAtt QuotationsTable.Arn
              - !Sub '${QuotationsTable.Arn}/index/*'
              - !GetAtt TasksTable.Arn
              - !Sub '${TasksTable.Arn}/index/*'
              - !GetAtt InboxTable.Arn
              - !Sub '${InboxTable.Arn}/index/*'
              - !GetAtt SettingsTable.Arn
              - !GetAtt AuditTable.Arn
              - !Sub '${AuditTable.Arn}/index/*'
              - !GetAtt NotificationsTable.Arn
              - !GetAtt AutomationRunsTable.Arn
              - !Sub '${AutomationRunsTable.Arn}/index/*'
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan]
            Resource:
              - !GetAtt ProductsTable.Arn
              - !GetAtt LandsTable.Arn
              - !Sub '${LandsTable.Arn}/index/*'
              - !GetAtt CropCyclesTable.Arn
              - !Sub '${CropCyclesTable.Arn}/index/*'

  # ── WhatsApp Business secrets (SSM SecureString under /naveena/whatsapp/*) ────
  WhatsAppSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read/write the WhatsApp Business access token, app secret and webhook verify token
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [ssm:GetParameter, ssm:PutParameter, ssm:DeleteParameter]
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/naveena/whatsapp/*'
          - Effect: Allow
            Action: [kms:Encrypt, kms:Decrypt]
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  WhatsAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.whatsapp.handler
      Description: WhatsApp Business config, test send and signed Meta webhook (statuses, inbound messages, opt-out)
      Policies:
        - !Ref CoreDataPolicy
        - !Ref WhatsAppSecretsPolicy
      Events:
        Sub: { Type: HttpApi, Properties: { Path: "/whatsapp/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Expert consultations ("Get Suggestions from Experts") ────────────────────
  ConsultationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.consultations.handler
      Description: Consultation requests, automatic expert assignment, linked CRM lead creation
      Policies:
        - !Ref CoreDataPolicy
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]   # GetObject signs the short-lived photo URLs
              Resource: !Sub '${RecordPhotosBucket.Arn}/consultations/*'
      Events:
        Root: { Type: HttpApi, Properties: { Path: /consultations,           Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/consultations/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── CRM ───────────────────────────────────────────────────────────────────────
  CrmFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.crm.handler
      Description: Shared CRM – leads, pipeline, activities, calls, WhatsApp click-to-chat, dashboards
      Policies:
        - !Ref CoreDataPolicy
        - !Ref WhatsAppSecretsPolicy
      Events:
        Sub: { Type: HttpApi, Properties: { Path: "/crm/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Quotations ────────────────────────────────────────────────────────────────
  QuotationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.quotations.handler
      Description: Product quotations – backend pricing, approval, sharing, customer response
      Policies:
        - !Ref CoreDataPolicy
        - !Ref WhatsAppSecretsPolicy
      Events:
        Root: { Type: HttpApi, Properties: { Path: /quotations,           Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/quotations/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Follow-ups, appointments, tasks ──────────────────────────────────────────
  TasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.tasks.handler
      Description: Follow-ups, appointments and tasks
      Policies:
        - !Ref CoreDataPolicy
      Events:
        Root: { Type: HttpApi, Properties: { Path: /tasks,           Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/tasks/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Team users (staff / experts / admins) ────────────────────────────────────
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.users.handler
      Description: Staff, expert and admin account management
      Policies:
        - !Ref CoreDataPolicy
      Events:
        Root: { Type: HttpApi, Properties: { Path: /users,           Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/users/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Personal profile & preferences ───────────────────────────────────────────
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.profile.handler
      Description: Own profile, preferences and profile photo
      Policies:
        - !Ref CoreDataPolicy
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${RecordPhotosBucket.Arn}/profiles/*'
      Events:
        Root: { Type: HttpApi, Properties: { Path: /profile,           Method: ANY, ApiId: !Ref Api } }
        Sub:  { Type: HttpApi, Properties: { Path: "/profile/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── AI (OpenAI / Gemini) ─────────────────────────────────────────────────────
  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.ai.handler
      Description: AI configuration (Super Admin) and role-scoped AI assistance
      Policies:
        - !Ref CoreDataPolicy
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:PutParameter, ssm:DeleteParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/naveena/ai/*'
            - Effect: Allow   # SecureString with the AWS-managed aws/ssm key, only via SSM
              Action: [kms:Encrypt, kms:Decrypt]
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
      Events:
        Sub: { Type: HttpApi, Properties: { Path: "/ai/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Administration settings, audit log, role dashboards ──────────────────────
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.admin.handler
      Description: Platform settings, permissions, audit logs and role dashboards
      Policies:
        - !Ref CoreDataPolicy
      Events:
        Sub:       { Type: HttpApi, Properties: { Path: "/admin/{proxy+}", Method: ANY, ApiId: !Ref Api } }
        Dashboard: { Type: HttpApi, Properties: { Path: /dashboard,        Method: ANY, ApiId: !Ref Api } }

  # ── Automation rule builder (configurable escalation / follow-up / alert rules) ─
  AutomationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.automation.handler
      Description: Configurable automation rules (Super Admin / Admin) and their execution history
      Policies:
        - !Ref CoreDataPolicy
      Events:
        Sub: { Type: HttpApi, Properties: { Path: "/automation/{proxy+}", Method: ANY, ApiId: !Ref Api } }

  # ── Reminders, consultation escalation, quotation expiry ─────────────────────
  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.scheduler.handler
      Description: Every 15 min – task reminders, overdue consultation escalation, quotation expiry
      Timeout: 120
      Policies:
        - !Ref CoreDataPolicy
      Events:
        Every15Min:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Enabled: true

  # ── Account Deletion (Google Play compliance) ────────────────────────────────
  AccountDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.delete_account.handler
      Description: Authenticated user requests deletion of their own account — flags it PENDING, does not hard-delete
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Root: { Type: HttpApi, Properties: { Path: /account/delete, Method: POST, ApiId: !Ref Api } }

  CleanupDeletedAccountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.cleanup_deleted_accounts.handler
      Description: Daily EventBridge job — permanently purges accounts past their 30-day deletion grace period
      Timeout: 300   # not behind API Gateway, so the 29s Globals cap doesn't apply; this can walk many nested items
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref RecordPhotosBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LandsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CropCyclesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyRecordsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdviceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EnquiriesTable
        - !Ref CoreDataPolicy
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub '${RecordPhotosBucket.Arn}/*'
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: Runs once daily to hard-delete accounts past their deletion grace period
            Enabled: true

  # ─────────────────────────────────────────────────────────────────────────────
  # S3  (public-read photo storage, shared by RecordsFunction "records/" and ProductsFunction "products/" key prefixes)
  # ─────────────────────────────────────────────────────────────────────────────
  RecordPhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'naveena-record-photos-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']

  RecordPhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecordPhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only these prefixes are public. consultations/ (customer crop photos)
          # stays private and is served through short-lived presigned URLs.
          - Sid: PublicReadRecordPhotos
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub '${RecordPhotosBucket.Arn}/records/*'
              - !Sub '${RecordPhotosBucket.Arn}/products/*'
              - !Sub '${RecordPhotosBucket.Arn}/profiles/*'

  # ─────────────────────────────────────────────────────────────────────────────
  # DYNAMODB TABLES  (PAY_PER_REQUEST = on-demand, auto-scales to any load)
  # DeletionPolicy: Retain – tables survive stack deletion (data safety)
  # ─────────────────────────────────────────────────────────────────────────────

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: phone,  AttributeType: S }
        - { AttributeName: role,   AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: PhoneIndex
          KeySchema:
            - { AttributeName: phone, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: RoleIndex      # experts/staff lookups, audience fan-out, role counts
          KeySchema:
            - { AttributeName: role, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  LandsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-lands
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: landId,   AttributeType: S }
        - { AttributeName: farmerId, AttributeType: S }
      KeySchema:
        - { AttributeName: landId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: FarmerIndex
          KeySchema:
            - { AttributeName: farmerId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  CropCyclesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-crop-cycles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: landId,  AttributeType: S }
        - { AttributeName: cycleId, AttributeType: S }
      KeySchema:
        - { AttributeName: landId,  KeyType: HASH }
        - { AttributeName: cycleId, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: CycleIdIndex
          KeySchema:
            - { AttributeName: cycleId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  DailyRecordsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-daily-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: cycleId,  AttributeType: S }
        - { AttributeName: sortKey,  AttributeType: S }  # date#recordId
        - { AttributeName: recordId, AttributeType: S }
      KeySchema:
        - { AttributeName: cycleId, KeyType: HASH }
        - { AttributeName: sortKey, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: RecordIdIndex
          KeySchema:
            - { AttributeName: recordId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: productId, AttributeType: S }
      KeySchema:
        - { AttributeName: productId, KeyType: HASH }

  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: orderId,    AttributeType: S }
        - { AttributeName: customerId, AttributeType: S }
        - { AttributeName: createdAt,  AttributeType: S }
      KeySchema:
        - { AttributeName: orderId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: CustomerIndex
          KeySchema:
            - { AttributeName: customerId, KeyType: HASH }
            - { AttributeName: createdAt,  KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  AdviceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-advice
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: adviceId,  AttributeType: S }
        - { AttributeName: farmerId,  AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: adviceId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: FarmerIndex
          KeySchema:
            - { AttributeName: farmerId,  KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-notifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: notifId, AttributeType: S }
      KeySchema:
        - { AttributeName: notifId, KeyType: HASH }

  EnquiriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-enquiries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: enquiryId, AttributeType: S }
        - { AttributeName: farmerId,  AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: enquiryId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: FarmerIndex
          KeySchema:
            - { AttributeName: farmerId,  KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  SymptomsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-symptoms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: symptomId, AttributeType: S }
      KeySchema:
        - { AttributeName: symptomId, KeyType: HASH }

  # ── CRM / consultation / notification / settings tables ─────────────────────
  ConsultationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-consultations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: consultationId, AttributeType: S }
        - { AttributeName: customerId, AttributeType: S }
        - { AttributeName: expertId, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: consultationId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: CustomerIndex
          KeySchema:
            - { AttributeName: customerId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: ExpertIndex
          KeySchema:
            - { AttributeName: expertId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: StatusIndex
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  LeadsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-leads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: leadId, AttributeType: S }
        - { AttributeName: ownerId, AttributeType: S }
        - { AttributeName: expertId, AttributeType: S }
        - { AttributeName: phone, AttributeType: S }
        - { AttributeName: stage, AttributeType: S }
        - { AttributeName: customerId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: leadId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - { AttributeName: ownerId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: ExpertIndex
          KeySchema:
            - { AttributeName: expertId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: PhoneIndex
          KeySchema:
            - { AttributeName: phone, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: StageIndex
          KeySchema:
            - { AttributeName: stage, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: CustomerIndex
          KeySchema:
            - { AttributeName: customerId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  LeadActivitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-lead-activities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: leadId, AttributeType: S }
        - { AttributeName: sortKey, AttributeType: S }
        - { AttributeName: actorId, AttributeType: S }
        - { AttributeName: feed, AttributeType: S }
      KeySchema:
        - { AttributeName: leadId, KeyType: HASH }
        - { AttributeName: sortKey, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ActorIndex
          KeySchema:
            - { AttributeName: actorId, KeyType: HASH }
            - { AttributeName: sortKey, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: FeedIndex
          KeySchema:
            - { AttributeName: feed, KeyType: HASH }
            - { AttributeName: sortKey, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  QuotationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-quotations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: quotationId, AttributeType: S }
        - { AttributeName: leadId, AttributeType: S }
        - { AttributeName: customerId, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdBy, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: quotationId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: LeadIndex
          KeySchema:
            - { AttributeName: leadId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: CustomerIndex
          KeySchema:
            - { AttributeName: customerId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: StatusIndex
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: CreatorIndex
          KeySchema:
            - { AttributeName: createdBy, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  TasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: taskId, AttributeType: S }
        - { AttributeName: assigneeId, AttributeType: S }
        - { AttributeName: leadId, AttributeType: S }
        - { AttributeName: customerId, AttributeType: S }
        - { AttributeName: dueAt, AttributeType: S }
        - { AttributeName: reminderPending, AttributeType: S }
        - { AttributeName: reminderAt, AttributeType: S }
      KeySchema:
        - { AttributeName: taskId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: AssigneeIndex
          KeySchema:
            - { AttributeName: assigneeId, KeyType: HASH }
            - { AttributeName: dueAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: LeadIndex
          KeySchema:
            - { AttributeName: leadId, KeyType: HASH }
            - { AttributeName: dueAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: CustomerIndex
          KeySchema:
            - { AttributeName: customerId, KeyType: HASH }
            - { AttributeName: dueAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: ReminderIndex
          KeySchema:
            - { AttributeName: reminderPending, KeyType: HASH }
            - { AttributeName: reminderAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  InboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-notification-inbox
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: recipientKey, AttributeType: S }
        - { AttributeName: notifId, AttributeType: S }
        - { AttributeName: pushPending, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: recipientKey, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: NotifIndex
          KeySchema:
            - { AttributeName: notifId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: PushPendingIndex   # sparse: only items awaiting an Expo push receipt
          KeySchema:
            - { AttributeName: pushPending, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: purgeAt, Enabled: true }   # notification history retention

  SettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: settingKey, AttributeType: S }
      KeySchema:
        - { AttributeName: settingKey, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expiresAtEpoch, Enabled: true }   # rate-limit counters

  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-audit-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: auditDay, AttributeType: S }
        - { AttributeName: sortKey, AttributeType: S }
        - { AttributeName: entityId, AttributeType: S }
      KeySchema:
        - { AttributeName: auditDay, KeyType: HASH }
        - { AttributeName: sortKey, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: EntityIndex
          KeySchema:
            - { AttributeName: entityId, KeyType: HASH }
            - { AttributeName: sortKey, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  AutomationRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: naveena-automation-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: runId, AttributeType: S }
        - { AttributeName: ruleId, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: runId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: RuleIndex
          KeySchema:
            - { AttributeName: ruleId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: StatusIndex
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

# ─── Outputs ─────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1
    Export:
      Name: NaveenaApiUrl
